services:
  postgres:
    image: postgres:16
    container_name: ai_chat_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: ai_chat
    ports:
      - '5433:5432'
    volumes:
      - ai_chat_postgres_data:/var/lib/postgresql/data
    networks:
      - pg_network

networks:
  pg_network:
    driver: bridge

volumes:
  ai_chat_postgres_data:
